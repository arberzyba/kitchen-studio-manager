spring.datasource.url=jdbc:postgresql://localhost:5432/sedzkitchens
spring.datasource.username=sedzkitchens
spring.datasource.password=${DB_PASSWORD:sedzkitchens}

# Signs login tokens; at least 32 characters. Local development default only.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}

# The browser loads the app from the Vite dev server, which forwards API calls here. Those calls still
# carry the dev server's address as their origin, so it has to be allowed.
app.cors.allowed-origins=http://localhost:5173

# Without a mail server, emails are only written to the log.
# To receive them locally, start Mailpit (https://mailpit.axllent.org) and uncomment:
#spring.mail.host=localhost
#spring.mail.port=1025
