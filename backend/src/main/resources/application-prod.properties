# Production settings. Every value comes from an environment variable of the hosting platform,
# so no secret is stored in the repository.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Signs login tokens; at least 32 random characters
app.jwt.secret=${JWT_SECRET}

# Address of the hosted frontend, which is allowed to call this API from the browser
app.cors.allowed-origins=${FRONTEND_URL}

# Hosting platforms assign the port through PORT
server.port=${PORT:8080}

# Email is optional: set SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD
# to send quotes and invoices. Without them, emails are only written to the log.
